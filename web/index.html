<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MergeCamp is a tactical offline merge puzzle with natural board pressure.">
  <meta name="theme-color" content="#12211A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MergeCamp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MergeCamp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .games-home-link {
      position: fixed;
      z-index: 2147483647;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      color: white;
      background: rgba(12, 24, 19, .82);
      box-shadow: 0 5px 18px rgba(0, 0, 0, .24);
      font: 600 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
    .games-home-link:focus-visible { outline: 3px solid #c9f36a; outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="games-home-link" href="https://bon-on.github.io/" aria-label="게임 선택 화면으로 돌아가기">← 게임 목록</a>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
