<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MergeCamp is a tactical offline merge puzzle with natural board pressure.">
  <meta name="theme-color" content="#12211A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MergeCamp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MergeCamp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --games-nav-height: calc(48px + env(safe-area-inset-top)); }
    html, body { height: 100%; margin: 0; }
    /* Flutter renders into this host, which starts below the nav bar. */
    #flutter-host {
      position: fixed;
      inset: var(--games-nav-height) 0 0 0;
    }
    .games-nav-bar {
      position: fixed;
      z-index: 2147483647;
      inset: 0 0 auto;
      height: var(--games-nav-height);
      padding: env(safe-area-inset-top) 12px 0;
      display: flex;
      align-items: center;
      background: #10231b;
      box-sizing: border-box;
    }
    .games-home-link {
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      background: rgba(255, 255, 255, .1);
      font: 600 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
    }
    .games-home-link:focus-visible { outline: 3px solid #c9f36a; outline-offset: 2px; }
    body {
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <nav class="games-nav-bar" aria-label="게임 내비게이션">
    <a class="games-home-link" href="https://bon-on.github.io/" aria-label="게임 선택 화면으로 돌아가기">← 게임 목록</a>
  </nav>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="flutter-host"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
